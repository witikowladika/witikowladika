    <rect x="1160" y="222" width="370" height="140" rx="14" fill="#fff" fill-opacity="0.6" stroke="#162a24" stroke-opacity="0.08"/>
    <path d="M1186 342 H1506 M1186 252 V342" stroke="#162a24" stroke-opacity="0.25" fill="none"/>
    <path d="M1186 330 C1240 326 1270 300 1320 290 S1420 262 1506 246 V342 H1186 Z" fill="url(#area)"/>
    <path d="M1186 330 C1240 326 1270 300 1320 290 S1420 262 1506 246" fill="none" stroke="#1f5f6b" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M1186 318 C1250 316 1300 312 1350 300 S1440 290 1506 286" fill="none" stroke="#b5603a" stroke-width="2.2" stroke-dasharray="6 6" stroke-linecap="round"/>
    <circle cx="1506" cy="246" r="5" fill="#1f5f6b"/>
