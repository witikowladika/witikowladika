      <path d="M980 92 H1010 V124 H1038" marker-end="url(#ar)"/>
      <path d="M980 158 H1010 V124"/>
      <path d="M1170 124 H1200 V81 H1228" marker-end="url(#ar)"/>
      <path d="M1200 124 H1228" marker-end="url(#ar)"/>
      <path d="M1200 124 V167 H1228" marker-end="url(#ar)"/>
      <path d="M1330 81 H1365 V123 H1398" marker-end="url(#ar)"/>
      <path d="M1330 124 H1365"/>
      <path d="M1330 167 H1365 V123"/>
    </g>
    <!-- inputs -->
    <rect x="880" y="70" width="100" height="44" rx="10" fill="#fff" fill-opacity="0.85" stroke="#1f5f6b" stroke-opacity="0.4"/>
    <text x="930" y="97">Data</text>
    <rect x="880" y="136" width="100" height="44" rx="10" fill="#fff" fill-opacity="0.85" stroke="#1f5f6b" stroke-opacity="0.4"/>
    <text x="930" y="163">Constraints</text>
