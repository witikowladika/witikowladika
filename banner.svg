  <!-- text -->
  <g font-family="'EB Garamond',Garamond,Georgia,serif" fill="#162a24">
    <text x="90" y="150" font-size="76" font-weight="300">Witiko</text>
    <text x="90" y="225" font-size="76" font-weight="300">Melle-Wladika</text>
