    <rect x="1040" y="70" width="130" height="108" rx="12" fill="#fff" fill-opacity="0.92" stroke="#1f5f6b" stroke-width="2"/>
    <text x="1105" y="96" font-weight="600" fill="#1f5f6b">Model</text>
    <path d="M1058 160 L1074 140 L1090 150 L1108 122 L1126 136 L1152 112" fill="none" stroke="#1f5f6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- options -->
    <rect x="1230" y="62" width="100" height="38" rx="10" fill="#fff" fill-opacity="0.85" stroke="#1f5f6b" stroke-opacity="0.4"/>
    <text x="1280" y="86">Option A</text>
    <rect x="1230" y="105" width="100" height="38" rx="10" fill="#fff" fill-opacity="0.85" stroke="#1f5f6b" stroke-opacity="0.4"/>
    <text x="1280" y="129">Option B</text>
    <rect x="1230" y="148" width="100" height="38" rx="10" fill="#fff" fill-opacity="0.85" stroke="#1f5f6b" stroke-opacity="0.4"/>
    <text x="1280" y="172">Option C</text>
    <!-- decision -->
    <rect x="1400" y="90" width="130" height="66" rx="33" fill="#1f5f6b"/>
