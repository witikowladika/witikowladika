    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f5f6b" stop-opacity="0.22"/><stop offset="1" stop-color="#1f5f6b" stop-opacity="0"/></linearGradient>
  </defs>
  <g font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="14" fill="#162a24" text-anchor="middle">
