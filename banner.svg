<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <radialGradient id="a1" cx="0.12" cy="0.1" r="0.6"><stop offset="0" stop-color="#cfe3df"/><stop offset="1" stop-color="#cfe3df" stop-opacity="0"/></radialGradient>
    <radialGradient id="a2" cx="0.92" cy="0.95" r="0.6"><stop offset="0" stop-color="#e3dbef"/><stop offset="1" stop-color="#e3dbef" stop-opacity="0"/></radialGradient>
    <radialGradient id="a3" cx="0.62" cy="0.1" r="0.4"><stop offset="0" stop-color="#f3e3d3"/><stop offset="1" stop-color="#f3e3d3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#162a24" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <marker id="cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9z" fill="#1f5f6b"/></marker>
    <marker id="hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9z" fill="#b5603a"/></marker>
  </defs>
  <rect width="1600" height="400" fill="#f4f5f2"/>
  <rect width="1600" height="400" fill="url(#a1)"/>
  <rect width="1600" height="400" fill="url(#a2)"/>
  <rect width="1600" height="400" fill="url(#a3)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <!-- workflow + charts -->
  <defs>
