    <rect x="880" y="222" width="250" height="140" rx="14" fill="#fff" fill-opacity="0.6" stroke="#162a24" stroke-opacity="0.08"/>
    <g fill="#1f5f6b">
      <rect x="908" y="300" width="28" height="42" rx="4" fill-opacity="0.35"/>
      <rect x="948" y="278" width="28" height="64" rx="4" fill-opacity="0.5"/>
      <rect x="988" y="290" width="28" height="52" rx="4" fill-opacity="0.35"/>
      <rect x="1028" y="252" width="28" height="90" rx="4"/>
      <rect x="1068" y="270" width="28" height="72" rx="4" fill-opacity="0.5"/>
    </g>
    <path d="M900 342 H1110" stroke="#162a24" stroke-opacity="0.25"/>
