  <rect x="92" y="250" width="64" height="3" rx="1.5" fill="#1f5f6b"/>
  <text x="92" y="292" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="28" fill="#1f5f6b">Designing Robust Industrial Energy Systems</text>

  <!-- pills (text centered in each pill) -->
  <g font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="17" fill="#162a24" text-anchor="middle">
    <rect x="92" y="318" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.8" stroke="#1f5f6b" stroke-opacity="0.35"/>
    <text x="151" y="342">Energy</text>
    <rect x="222" y="318" width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.8" stroke="#1f5f6b" stroke-opacity="0.35"/>
    <text x="276" y="342">Utilities</text>
    <rect x="342" y="318" width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.8" stroke="#1f5f6b" stroke-opacity="0.35"/>
