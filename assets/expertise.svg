<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img">
<style>
:root{--bg:#f4f5f2;--ink:#162a24;--acc:#1f5f6b;--warm:#b5603a;--card:#ffffff;--onacc:#ffffff;--b1:#cfe3df;--b2:#e3dbef;--b3:#f3e3d3}
@media (prefers-color-scheme: dark){:root{--bg:#0e1816;--ink:#e9f0ed;--acc:#6fc0cc;--warm:#e39367;--card:#16262a;--onacc:#0e1816;--b1:#17413f;--b2:#2a2347;--b3:#3d2a1e}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.mute{fill:var(--ink);fill-opacity:.7}.acc{fill:var(--acc)}.warm{fill:var(--warm)}
.card{fill:var(--card);fill-opacity:.8}.cardl{fill:var(--card);fill-opacity:.55}.onacc{fill:var(--onacc)}
.sa{stroke:var(--acc)}.sw{stroke:var(--warm)}.si{stroke:var(--ink)}.edge{stroke:var(--ink);stroke-opacity:.12}
.f0{fill:none}
text{font-family:Inter,'Segoe UI',Arial,sans-serif}text.serif{font-family:'EB Garamond',Garamond,Georgia,serif}
</style>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.0s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.0s" dur=".6s" fill="freeze"/>
<rect x="20" y="15" width="370" height="190" rx="18" class="card edge"/>
<rect x="48" y="15" width="48" height="4" rx="2" class="acc"/>
<g transform="translate(48 45)"><g class="f0 sa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24 A19 19 0 0 1 44 16"/><path d="M40 10 L45 17 L37 19"/><path d="M46 32 A19 19 0 0 1 12 40" class="sw"/><path d="M16 46 L11 39 L19 37" class="sw"/></g></g>
<text x="48" y="133" font-size="21" font-weight="600" class="ink">Heat pumps &amp; chillers</text>
<text x="48" y="161" font-size="15" class="mute">Sizing, integration and operation of</text>
<text x="48" y="181" font-size="15" class="mute">heat and cold generation.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.1s" dur=".6s" fill="freeze"/>
<rect x="415" y="15" width="370" height="190" rx="18" class="card edge"/>
<rect x="443" y="15" width="48" height="4" rx="2" class="acc"/>
<g transform="translate(443 45)"><g class="f0 sa" stroke-width="2.5" stroke-linejoin="round"><g><animateTransform attributeName="transform" type="rotate" from="0 28 28" to="360 28 28" dur="7s" repeatCount="indefinite"/><path d="M28 25 C26 8 44 8 44 20 C39 18 32 20 28 25 Z"/><g transform="rotate(120 28 28)"><path d="M28 25 C26 8 44 8 44 20 C39 18 32 20 28 25 Z"/></g><g transform="rotate(240 28 28)"><path d="M28 25 C26 8 44 8 44 20 C39 18 32 20 28 25 Z"/></g></g><circle cx="28" cy="28" r="3.5" class="acc"/></g></g>
<text x="443" y="133" font-size="21" font-weight="600" class="ink">Ventilation &amp; HVAC</text>
<text x="443" y="161" font-size="15" class="mute">Air handling and conditioning for</text>
<text x="443" y="181" font-size="15" class="mute">process and comfort.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.2s" dur=".6s" fill="freeze"/>
<rect x="810" y="15" width="370" height="190" rx="18" class="card edge"/>
<rect x="838" y="15" width="48" height="4" rx="2" class="acc"/>
<g transform="translate(838 45)"><g class="f0 sa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12 H48 M28 12 V28 M8 28 H48 M8 28 V44 M28 28 V44 M48 28 V44"/></g><g class="acc"><circle cx="8" cy="12" r="4"/><circle cx="48" cy="12" r="4"/><circle cx="28" cy="28" r="4.5"/><circle cx="8" cy="44" r="4"/><circle cx="28" cy="44" r="4"/><circle cx="48" cy="44" r="4"/></g></g>
<text x="838" y="133" font-size="21" font-weight="600" class="ink">Utilities &amp; networks</text>
<text x="838" y="161" font-size="15" class="mute">Heating, cooling and steam: generation</text>
<text x="838" y="181" font-size="15" class="mute">to distribution.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.30000000000000004s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.30000000000000004s" dur=".6s" fill="freeze"/>
<rect x="20" y="230" width="370" height="190" rx="18" class="card edge"/>
<rect x="48" y="230" width="48" height="4" rx="2" class="acc"/>
