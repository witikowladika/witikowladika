<rect x="838" y="230" width="48" height="4" rx="2" class="acc"/>
<g transform="translate(838 260)"><g class="f0 sa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="46" height="32" rx="6"/><path d="M22 18 L36 26 L22 34 Z" class="acc"/><path d="M18 49 H38"/></g></g>
<text x="838" y="348" font-size="21" font-weight="600" class="ink">Knowledge sharing</text>
<text x="838" y="376" font-size="15" class="mute">Explaining how real plants are designed,</text>
<text x="838" y="396" font-size="15" class="mute">with the numbers.</text></g>
