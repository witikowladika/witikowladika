<text x="48" y="348" font-size="21" font-weight="600" class="ink">Simulation &amp; planning</text>
<text x="48" y="376" font-size="15" class="mute">Energy system models for investment</text>
<text x="48" y="396" font-size="15" class="mute">decisions.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.4s" dur=".6s" fill="freeze"/>
<rect x="415" y="230" width="370" height="190" rx="18" class="card edge"/>
<rect x="443" y="230" width="48" height="4" rx="2" class="acc"/>
<g transform="translate(443 260)"><g class="f0 sa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M28 5 L48 16.5 V39.5 L28 51 L8 39.5 V16.5 Z"/><path d="M18 28 L25 35 L38 21" class="sw"/></g></g>
<text x="443" y="348" font-size="21" font-weight="600" class="ink">Robust design</text>
<text x="443" y="376" font-size="15" class="mute">Reliable, maintainable solutions that</text>
<text x="443" y="396" font-size="15" class="mute">run in the real plant.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.5s" dur=".6s" fill="freeze"/>
