<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 56" width="1000" height="56" role="img">
<style>
:root{--bg:#f4f5f2;--ink:#162a24;--acc:#1f5f6b;--warm:#b5603a;--card:#ffffff;--onacc:#ffffff;--b1:#cfe3df;--b2:#e3dbef;--b3:#f3e3d3}
@media (prefers-color-scheme: dark){:root{--bg:#0e1816;--ink:#e9f0ed;--acc:#6fc0cc;--warm:#e39367;--card:#16262a;--onacc:#0e1816;--b1:#17413f;--b2:#2a2347;--b3:#3d2a1e}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.mute{fill:var(--ink);fill-opacity:.7}.acc{fill:var(--acc)}.warm{fill:var(--warm)}
.card{fill:var(--card);fill-opacity:.8}.cardl{fill:var(--card);fill-opacity:.55}.onacc{fill:var(--onacc)}
.sa{stroke:var(--acc)}.sw{stroke:var(--warm)}.si{stroke:var(--ink)}.edge{stroke:var(--ink);stroke-opacity:.12}
.f0{fill:none}
text{font-family:Inter,'Segoe UI',Arial,sans-serif}text.serif{font-family:'EB Garamond',Garamond,Georgia,serif}
</style>
<text x="500" y="38" text-anchor="middle" font-size="30" font-style="italic" class="serif acc" opacity="0">Heat pumps, chillers &amp; ventilation: sized right.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.020;0.300;0.330;1" dur="12s" repeatCount="indefinite"/></text><text x="500" y="38" text-anchor="middle" font-size="30" font-style="italic" class="serif acc" opacity="0">Utilities and infrastructure that keep running.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.353;0.633;0.663;1" dur="12s" repeatCount="indefinite"/></text><text x="500" y="38" text-anchor="middle" font-size="30" font-style="italic" class="serif acc" opacity="0">Investment decisions that hold up under uncertainty.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.687;0.967;0.997;1" dur="12s" repeatCount="indefinite"/></text>
</svg>
