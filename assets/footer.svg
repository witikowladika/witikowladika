<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 126" width="1200" height="126" role="img">
<style>
:root{--bg:#f4f5f2;--ink:#162a24;--acc:#1f5f6b;--warm:#b5603a;--card:#ffffff;--onacc:#ffffff;--b1:#cfe3df;--b2:#e3dbef;--b3:#f3e3d3}
@media (prefers-color-scheme: dark){:root{--bg:#0e1816;--ink:#e9f0ed;--acc:#6fc0cc;--warm:#e39367;--card:#16262a;--onacc:#0e1816;--b1:#17413f;--b2:#2a2347;--b3:#3d2a1e}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.mute{fill:var(--ink);fill-opacity:.7}.acc{fill:var(--acc)}.warm{fill:var(--warm)}
.card{fill:var(--card);fill-opacity:.8}.cardl{fill:var(--card);fill-opacity:.55}.onacc{fill:var(--onacc)}
.sa{stroke:var(--acc)}.sw{stroke:var(--warm)}.si{stroke:var(--ink)}.edge{stroke:var(--ink);stroke-opacity:.12}
.f0{fill:none}
text{font-family:Inter,'Segoe UI',Arial,sans-serif}text.serif{font-family:'EB Garamond',Garamond,Georgia,serif}
</style>
<defs><linearGradient id="f" x1="0" x2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:0"/><stop offset=".25" style="stop-color:var(--acc)"/><stop offset=".75" style="stop-color:var(--warm)"/><stop offset="1" style="stop-color:var(--warm);stop-opacity:0"/></linearGradient></defs>
<path d="M0 70 C100 70 120 25 200 25 S300 85 380 62 S520 15 600 35 S760 95 840 55 S1000 15 1080 40 S1160 62 1200 55" fill="none" stroke="url(#f)" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;0;0;-1" keyTimes="0;.45;.8;1" dur="9s" repeatCount="indefinite"/></path>
<text x="600" y="112" text-anchor="middle" font-size="15" letter-spacing="2" class="mute">THANKS FOR STOPPING BY</text>
</svg>
